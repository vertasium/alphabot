app = "alphabot"
primary_region = "sin"  # Singapore — closest to India

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8888"

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = false   # Keep running (trading loop!)
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8888"
